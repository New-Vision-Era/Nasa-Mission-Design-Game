# Publishes the game to GitHub Pages (game at the site root).
# The site runs the Python backend in the browser (Pyodide), so no server is needed.
#
# This repository's Pages is set to "Deploy from a branch: final-version", which serves the repo
# root (index.html there redirects to frontend/game/). This workflow is the alternative: set
# Settings -> Pages -> Source to "GitHub Actions", then run it from the Actions tab (or add a push
# trigger). Running both would make the two deployments overwrite each other.
name: Deploy game to GitHub Pages (Actions source)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: bash scripts/build_pages.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
