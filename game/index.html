<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>SpaceMissionMVP</title>
		<style>
:root {
	color-scheme: dark;
	--space-bg: #050b16;
	--space-cyan: #55dff5;
}
* { box-sizing: border-box; }
html, body {
	width: 100%; height: 100%; min-width: 320px;
	margin: 0; padding: 0; border: 0;
	background: var(--space-bg);
}
body {
	position: relative; overflow: hidden; color: #eaf6ff; touch-action: none;
	font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
	background: radial-gradient(ellipse at 50% 42%, rgba(20,67,105,.28), transparent 48%), #050b16;
}
#canvas {
	position: absolute; inset: 0; display: block;
	width: 100%; height: 100%; outline: none;
}
#canvas:focus { outline: none; }
#status, #status-splash, #status-progress, #status-notice { position: absolute; }
#status {
	z-index: 5; inset: 0; display: flex; flex-direction: column;
	justify-content: center; align-items: center; gap: 22px; padding: 28px;
	visibility: hidden;
	background: linear-gradient(rgba(5,11,22,.82), rgba(5,11,22,.94)),
		radial-gradient(ellipse at 50% 45%, #12314b 0%, #07111f 58%, #040914 100%);
	backdrop-filter: blur(12px);
}
#status::before {
	content: ""; position: absolute; inset: 0; pointer-events: none;
	background-image: linear-gradient(rgba(85,223,245,.035) 1px, transparent 1px),
		linear-gradient(90deg, rgba(85,223,245,.035) 1px, transparent 1px);
	background-size: 44px 44px;
	mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
}
#status-splash {
	position: relative; inset: auto; z-index: 1; display: block;
	width: min(180px, 42vw); height: min(180px, 42vw);
	max-width: 100%; max-height: 100%; margin: 0; object-fit: contain;
	filter: drop-shadow(0 0 24px rgba(58,202,235,.22));
}
#status-splash.show-image--false { display: none; }
#status-splash.fullsize--true { width: min(180px, 42vw); height: min(180px, 42vw); }
#status-splash.use-filter--false { image-rendering: pixelated; }
#status::after {
	content: "INITIALIZING MISSION CONTROL"; position: relative; z-index: 1;
	margin-top: -8px; color: var(--space-cyan); font-size: 11px;
	font-weight: 700; letter-spacing: .22em; text-align: center;
}
#status-progress {
	position: relative; z-index: 1; display: none;
	width: min(320px, 72vw); height: 5px; margin: 0; border: 0;
	border-radius: 99px; overflow: hidden; accent-color: var(--space-cyan);
	background: rgba(132,169,195,.18);
	box-shadow: 0 0 22px rgba(52,203,236,.12);
}
#status-progress::-webkit-progress-bar { border-radius: 99px; background: rgba(132,169,195,.18); }
#status-progress::-webkit-progress-value {
	border-radius: 99px; background: linear-gradient(90deg, #269fc9, #67efff);
	box-shadow: 0 0 14px rgba(85,223,245,.45);
}
#status-progress::-moz-progress-bar { border-radius: 99px; background: linear-gradient(90deg, #269fc9, #67efff); }
#status-notice {
	position: relative; z-index: 2; display: none;
	max-width: min(560px, calc(100vw - 40px)); margin: 0; padding: 16px 20px;
	border: 1px solid rgba(248,113,113,.42); border-radius: 12px;
	color: #ffe4e6; background: rgba(83,25,39,.78);
	box-shadow: 0 18px 50px rgba(0,0,0,.35);
	font-size: 13px; line-height: 1.6; text-align: center; overflow-wrap: anywhere;
}
@media (max-width: 600px) {
	#status { gap: 18px; padding: 20px; }
	#status::after { font-size: 10px; letter-spacing: .16em; }
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1556516,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
